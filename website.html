<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Link as Window</title>
    <style>
        /* Optional: You can style the iframe to make it look like a window */
        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Embedded Link as a Window</h1>
    <iframe src="https://replit.com/@DavidFahim/Chrome-Browser/?embed=1&output=1" title="Embedded Window"></iframe>
</body>
</html>
